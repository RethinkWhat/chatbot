<!-- donut.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Donut Inference Trigger</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    button { padding: 0.6rem 1rem; font-size: 1rem; }
    #status { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Run Donut Inference</h2>
  <button id="runBtn">Run JSON Extraction</button>
  <p id="status">Idle</p>

  <script>
    document.getElementById('runBtn').addEventListener('click', async () => {
      const status = document.getElementById('status');
      status.textContent = "Running inference...";

      try {
        const res = await fetch("http://localhost:8600/jsonify", { method: "POST" });
        if (!res.ok) throw new Error("Server error");
        const data = await res.json();
        status.textContent = "Done! Extracted: " + (data.files || []).length + " PDFs.";
      } catch (err) {
        console.error(err);
        status.textContent = "Failed to run inference.";
      }
    });
  </script>
</body>
</html>
